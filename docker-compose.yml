version: '3.8'

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    container_name: postgres-db
    image: postgres:16-alpine3.18
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=boilerplate
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  base:
    build:
      dockerfile: base.Dockerfile
    image: base
    env_file:
      - .env
    environment:
      - TYPEORM_HOST=postgres-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=boilerplate
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  init_db:
    image: base
    command: sh -c "npm run typeorm:run-migration && (npm run seed:run || true)"
    env_file:
      - .env
    environment:
      - TYPEORM_HOST=postgres-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=boilerplate
    depends_on:
      - db
      - base
    networks:
      - app-network

  backend:
    container_name: nestjs-backend
    image: base
    command: npm run start:dev
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - TYPEORM_HOST=postgres-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=boilerplate
      - PORT=3000
    depends_on:
      init_db:
        condition: service_completed_successfully
    networks:
      - app-network

  frontend:
    container_name: react-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - app-network
